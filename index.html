<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브, 자동화 가이드 — Lecture Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<style>
  :root{
    --ink:#121214;
    --panel:#1B1B1F;
    --panel-2:#202024;
    --text:#ECEAE3;
    --muted:#9A968D;
    --line:rgba(236,234,227,0.14);
    --amber:#FFB020;
    --teal:#49B7AE;
    --rec:#FF5D5D;
    --radius:14px;
    --maxw:900px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:#181818;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;
    background:rgba(18,18,20,0.72);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--muted);
  }
  .brand b{color:var(--text);}
  .admin-trigger{
    width:38px;height:38px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .2s ease, transform .2s ease;
    flex-shrink:0;
  }
  .admin-trigger:hover{border-color:var(--amber);transform:translateY(-1px);}
  .admin-trigger:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .admin-trigger span{
    width:6px;height:6px;border-radius:50%;background:var(--amber);
  }

  /* ---------- hero ---------- */
  .hero{
    max-width:var(--maxw);margin:0 auto;
    padding:88px 24px 64px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--muted);
    display:flex;align-items:center;gap:8px;margin:0 0 22px;
  }
  .rec-dot{
    width:7px;height:7px;border-radius:50%;background:var(--rec);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  h1{
    font-size:clamp(34px,6vw,58px);
    line-height:1.12;
    margin:0 0 22px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  h1 .accent{
    display:block;
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    line-height:1.2;
    color:var(--amber);
    margin-top:6px;
  }
  .lede{
    font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 34px;
  }
  .cta{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;
    border:1px solid var(--amber);
    border-radius:999px;
    text-decoration:none;
    font-weight:600;font-size:14px;
    color:var(--ink);background:var(--amber);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,176,32,0.25);}
  .cta:focus-visible{outline:2px solid var(--teal);outline-offset:3px;}
  .hero-meta{
    margin-top:40px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--muted);
    display:flex;gap:18px;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:18px;
  }
  .hero-meta b{color:var(--teal);}

  /* ---------- timeline ---------- */
  .timeline{
    max-width:var(--maxw);margin:0 auto;padding:20px 24px 40px;
    position:relative;
  }
  .timeline::before{
    content:"";position:absolute;left:47px;top:0;bottom:0;
    width:1px;background:var(--line);
  }
  @media (max-width:640px){.timeline::before{left:27px;}}

  .step{
    position:relative;
    display:grid;
    grid-template-columns:96px 1fr;
    gap:0 28px;
    padding:44px 0;
    opacity:0;transform:translateY(18px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .step.in-view{opacity:1;transform:translateY(0);}
  .step:first-child{padding-top:8px;}
  @media (max-width:640px){.step{grid-template-columns:56px 1fr;}}

  .step-num{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .step-num .dot{
    width:15px;height:15px;border-radius:50%;
    background:var(--amber);
    border:3px solid var(--ink);
    box-shadow:0 0 0 1px var(--line);
    flex-shrink:0;
  }
  .step-num .tc{color:var(--muted);writing-mode:horizontal-tb;}

  .step-body h2{
    font-size:22px;margin:0 0 12px;font-weight:700;letter-spacing:-0.01em;
  }
  .step-body p{
    color:var(--muted);font-size:15px;margin:0 0 24px;max-width:60ch;
  }

  /* ---------- 16:9 frame ---------- */
  figure.frame{margin:0;}
  .frame-16x9{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    background:
      radial-gradient(120% 120% at 100% 0%, rgba(73,183,174,0.14), transparent 55%),
      radial-gradient(120% 120% at 0% 100%, rgba(255,176,32,0.14), transparent 55%),
      var(--panel);
  }
  .frame-16x9 img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .frame-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.35;
  }
  .frame-hud{
    position:absolute;inset:0;padding:16px;
    display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;
  }
  .frame-hud .top{display:flex;align-items:center;gap:7px;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
    color:var(--muted);text-transform:uppercase;
  }
  .frame-hud .top .rd{width:6px;height:6px;border-radius:50%;background:var(--rec);animation:pulse 2s ease-in-out infinite;}
  .frame-hud .bottom{
    align-self:flex-end;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  }
  .frame-vis{
    position:absolute;left:16px;right:16px;bottom:44px;top:44px;
    display:flex;align-items:flex-end;gap:3px;
  }
  .frame-vis .bar{
    flex:1;background:linear-gradient(180deg, var(--amber), var(--teal));
    border-radius:2px 2px 0 0;opacity:0.85;
  }
  figcaption{
    margin-top:12px;font-size:13px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    display:flex;gap:8px;align-items:baseline;
  }
  figcaption::before{content:"Fig.";color:var(--teal);}

  /* ---------- footer ---------- */
  footer{
    max-width:var(--maxw);margin:0 auto;padding:40px 24px 80px;
    border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    color:var(--muted);font-size:13px;
  }
  footer .fmono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;}

  /* ---------- overlays / modals ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,8,9,0.72);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    width:100%;max-width:360px;padding:26px;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h3{margin:0 0 16px;font-size:17px;}
  .modal p{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
  .modal input[type=password]{
    width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:14px;margin-bottom:8px;
  }
  .modal input:focus-visible{outline:2px solid var(--amber);}
  .modal-error{color:var(--rec);font-size:12.5px;min-height:16px;margin:0 0 8px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .btn{
    padding:9px 16px;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--text);font-size:13.5px;font-weight:500;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--muted);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:700;}
  .btn.primary:hover{background:#ffc147;}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  /* ---------- admin panel ---------- */
  .admin-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;
    animation:pop .18s ease;
  }
  .admin-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 24px;border-bottom:1px solid var(--line);
  }
  .admin-head h3{margin:0;font-size:16px;}
  .admin-body{padding:20px 24px;overflow-y:auto;}
  .admin-section{margin-bottom:26px;}
  .admin-section h4{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--teal);margin:0 0 12px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input[type=text], .field textarea{
    width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:13.5px;font-family:inherit;resize:vertical;
  }
  .field input:focus-visible, .field textarea:focus-visible{outline:2px solid var(--amber);}
  .field input.url-fallback{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .img-row{display:flex;gap:12px;align-items:center;}
  .img-thumb{
    width:104px;aspect-ratio:16/9;flex-shrink:0;border-radius:7px;overflow:hidden;
    border:1px solid var(--line);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
  }
  .img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-thumb span{font-size:10px;color:var(--muted);text-align:center;padding:4px;
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em;}
  .img-controls{display:flex;flex-direction:column;gap:8px;}
  .img-controls .btn{text-align:center;font-size:12.5px;padding:8px 14px;}
  .img-controls .img-clear{color:var(--muted);}
  .img-note{margin:8px 0 0;font-size:11px;color:var(--teal);font-family:'JetBrains Mono',monospace;}
  .admin-actions{
    display:flex;gap:10px;flex-wrap:wrap;
    padding:16px 24px;border-top:1px solid var(--line);
  }
  .admin-actions .spacer{flex:1;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);
    background:var(--text);color:var(--ink);
    padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important;transition-duration:0.001s !important;}
    .step{opacity:1;transform:none;}
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand"><b>AISUHO</b> · YOUTUBE AUTOMATION</div>
    <button class="admin-trigger" id="adminTrigger" aria-label="관리자"><span></span></button>

  <section class="hero">

    <a class="cta" id="ctaLink" href="#" data-key="hero.ctaText" data-href-key="hero.ctaLink">유튜브 자동화 마스터클래스 영상 보러가기 →</a>
    <div class="hero-meta">
      <span><b>8</b> STEPS</span>
      <span>00:00 → 00:08</span>
      <span>PIPELINE · SETUP → PUBLISH</span>
    </div>
  </section>

  <section class="timeline" id="timeline"></section>

  <footer>
    <div data-key="footer.text" class="fmono">AISUHO · 유튜브 자동화 가이드</div>
    <div class="fmono">© 2026</div>
  </footer>

  <!-- login modal -->
  <div class="overlay" id="loginOverlay">
    <div class="modal">
      <h3>관리자 로그인</h3>
      <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off">
      <p class="modal-error" id="loginError"></p>
      <div class="modal-actions">
        <button class="btn" id="loginCancel">취소</button>
        <button class="btn primary" id="loginConfirm">확인</button>
      </div>
    </div>
  </div>

  <!-- admin panel -->
  <div class="overlay" id="adminOverlay">
    <div class="admin-panel">
      <div class="admin-head">
        <h3>어드민 관리</h3>
        <button class="btn" id="adminClose">닫기</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
      <div class="admin-actions">
        <button class="btn primary" id="saveBtn">저장</button>
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="importBtn">가져오기</button>
        <span class="spacer"></span>
        <button class="btn" id="resetBtn" style="color:var(--rec);border-color:var(--rec);">초기화</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>

  <!-- confirm modal -->
  <div class="overlay" id="confirmOverlay">
    <div class="modal">
      <h3>진행할까요?</h3>
      <p>저장된 모든 내용을 기본값으로 초기화합니다. 되돌릴 수 없습니다.</p>
      <div class="modal-actions">
        <button class="btn" id="confirmCancel">취소</button>
        <button class="btn primary" id="confirmOk">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

        caption:"컷 편집과 자막이 배치된 타임라인 화면", image:"" },

        caption:"업로드 전 마지막으로 점검하는 자막 오타 리스트", image:"" }
    ]
  };

  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  function mergeContent(incoming){
    var merged = clone(DEFAULT_CONTENT);
    if(incoming){
      merged.hero = Object.assign({}, merged.hero, incoming.hero||{});
      merged.footer = Object.assign({}, merged.footer, incoming.footer||{});
      if(Array.isArray(incoming.steps) && incoming.steps.length){
        merged.steps = merged.steps.map(function(s,i){
          return Object.assign({}, s, incoming.steps[i]||{});
        });
      }
    }
    return merged;
  }

  /* Local cache is TEXT ONLY (images stripped out) so it can never hit
     localStorage's few-MB quota again — actual images always come from
     Firestore. This is just a fast first-paint before syncFromCloud(). */
  function stripImages(content){
    var c = clone(content);
    c.steps = c.steps.map(function(s){ return Object.assign({}, s, {image:""}); });
    return c;
  }

  function loadContent(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return clone(DEFAULT_CONTENT);
      return mergeContent(JSON.parse(raw));
    }catch(e){ return clone(DEFAULT_CONTENT); }
  }

  var state = { content: loadContent() };

  function syncFromCloud(){
    if(!fbReady) return;
    siteCollectionRef().get().then(function(snapshot){
      if(snapshot.empty) return;
      var meta = null;
      var stepsById = {};
      snapshot.forEach(function(doc){
        if(doc.id === "meta") meta = doc.data();
        else if(/^step-\d+$/.test(doc.id)) stepsById[doc.id] = doc.data();
      });
      var incoming = {
        hero: meta && meta.hero,
        footer: meta && meta.footer,
        steps: DEFAULT_CONTENT.steps.map(function(_, i){ return stepsById[stepDocId(i)] || null; })
      };
      state.content = mergeContent(incoming);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stripImages(state.content))); }catch(e){}
      render();
      if(document.getElementById("adminOverlay").classList.contains("open")) buildAdminForm();
    }).catch(function(err){ console.warn("Firestore load failed:", err); });
  }

  function seededRand(seed){
    var x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function buildFrameVis(stepIndex){
    var bars = "";
    var n = 28;
    for(var b=0;b<n;b++){
      var h = 18 + Math.round(seededRand(stepIndex*97 + b*13) * 78);
      bars += '<div class="bar" style="height:'+h+'%"></div>';
    }
    return bars;
  }

  function frameHtml(step, idx){
    var num = idx+1;
    var tag = num < 10 ? "0"+num : ""+num;
    if(step.image && step.image.trim()){
      return '<img src="'+escapeAttr(step.image)+'" alt="'+escapeAttr(step.caption||step.title)+'">';
    }
    return ''
      + '<div class="frame-grid"></div>'
      + '<div class="frame-vis">'+buildFrameVis(num)+'</div>'
      + '<div class="frame-hud">'
      +   '<div class="top"><span class="rd"></span>SCN '+tag+'</div>'
      +   '<div class="bottom">00:'+tag+':00</div>'
      + '</div>';
  }

  function escapeHtml(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

  function renderTimeline(){
    var el = document.getElementById("timeline");
    var html = "";
    state.content.steps.forEach(function(step, i){
      var tag = (i+1) < 10 ? "0"+(i+1) : ""+(i+1);
      html += ''
        + '<div class="step" data-idx="'+i+'">'
        +   '<div class="step-num"><span class="dot"></span><span class="tc mono">'+tag+'</span></div>'
        +   '<div class="step-body">'
        +     '<h2>'+escapeHtml(step.title)+'</h2>'
        +     '<p>'+escapeHtml(step.desc)+'</p>'
        +     '<figure class="frame">'
        +       '<div class="frame-16x9">'+frameHtml(step,i)+'</div>'
        +       '<figcaption>'+escapeHtml(step.caption)+'</figcaption>'
        +     '</figure>'
        +   '</div>'
        + '</div>';
    });
    el.innerHTML = html;
    observeSteps();
  }

  function render(){
    var c = state.content;
    document.querySelector('[data-key="hero.eyebrowTopic"]').textContent = c.hero.eyebrowTopic;
    document.querySelector('[data-key="hero.titleAccent"]').textContent = c.hero.titleAccent;
    document.querySelector('[data-key="hero.lede"]').textContent = c.hero.lede;
    var cta = document.getElementById("ctaLink");
    cta.textContent = c.hero.ctaText;
    cta.setAttribute("href", c.hero.ctaLink || "#");
    document.querySelector('[data-key="footer.text"]').textContent = c.footer.text;
    renderTimeline();
  }

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function observeSteps(){
    var steps = document.querySelectorAll(".step");
    if(reduceMotion || !("IntersectionObserver" in window)){
      steps.forEach(function(s){ s.classList.add("in-view"); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add("in-view");
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.15 });
    steps.forEach(function(s){ io.observe(s); });
  }

  function updateThumb(idx, value){
    var thumb = document.getElementById("thumb_"+idx);
    if(!thumb) return;

  /* Compresses/resizes the photo, then — if it's still over the byte
     budget — tries progressively smaller size/quality combos until it
     fits (or gives up after the last, smallest attempt). This keeps each
     step's Firestore document safely under the 1MiB-per-document cap
     once the image is embedded as base64 alongside the step's text. */
  function resizeToBudget(file, maxBytes, cb){
    var attempts = [
      {maxDim:1400, quality:0.75},
      {maxDim:1200, quality:0.65},
      {maxDim:1000, quality:0.6},
      {maxDim:800,  quality:0.55},
      {maxDim:640,  quality:0.5}
    ];
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        tryAttempt(0);
        function tryAttempt(i){
          if(i >= attempts.length){ cb(null); return; }
          var opt = attempts[i];
          var scale = Math.min(1, opt.maxDim / Math.max(img.width, img.height));
          var cw = Math.max(1, Math.round(img.width*scale));
          var ch = Math.max(1, Math.round(img.height*scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
          var finish = function(blob){
            if(!blob){ tryAttempt(i+1); return; }
            if(blob.size <= maxBytes || i === attempts.length-1){ cb(blob); }
            else{ tryAttempt(i+1); }
          };
          if(canvas.toBlob){
            canvas.toBlob(finish, "image/jpeg", opt.quality);
          }else{
            try{
              fetch(canvas.toDataURL("image/jpeg", opt.quality)).then(function(r){ return r.blob(); }).then(finish).catch(function(){ tryAttempt(i+1); });
            }catch(err){ tryAttempt(i+1); }
          }
        }
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function blobToDataURL(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function field(path, label, value, isTextarea){
    var id = "f_"+path.replace(/\./g,"_");
    var v = escapeAttr(value);
    if(isTextarea){
      return '<div class="field"><label for="'+id+'">'+label+'</label>'
        + '<textarea id="'+id+'" rows="3" data-path="'+path+'">'+escapeHtml(value)+'</textarea></div>';
    }
    return '<div class="field"><label for="'+id+'">'+label+'</label>'
      + '<input type="text" id="'+id+'" data-path="'+path+'" value="'+v+'"></div>';
  }

  function imageField(path, label, value, idx){
    var id = "f_"+path.replace(/\./g,"_");
    var urlValue = value || "";
    var thumbInner = urlValue ? '<img src="'+escapeAttr(urlValue)+'" alt="">' : '<span>기본 그래픽</span>';
    return '<div class="field">'
      + '<label>'+label+'</label>'
      + '<div class="img-row">'
      +   '<div class="img-thumb" id="thumb_'+idx+'">'+thumbInner+'</div>'
      +   '<div class="img-controls">'
      +     '<label class="btn file-btn" for="file_'+idx+'">이미지 선택</label>'
      +     '<input type="file" id="file_'+idx+'" data-idx="'+idx+'" accept="image/*" hidden>'
      +     '<button type="button" class="btn img-clear" data-idx="'+idx+'">기본 그래픽으로</button>'
      +   '</div>'
      + '</div>'
      + '<input type="text" class="url-fallback" id="'+id+'" data-path="'+path+'" data-idx="'+idx+'" '
      +   'value="'+escapeAttr(urlValue)+'" placeholder="또는 이미지 URL 직접 입력">'
      + '</div>';
  }

  function setByPath(obj, path, value){
    var parts = path.split(".");
    var ref = obj;
    for(var i=0;i<parts.length-1;i++){ ref = ref[parts[i]]; }
    ref[parts[parts.length-1]] = value;
  }

  /* Pure-JS SHA-256 fallback — crypto.subtle requires a "secure context"
     (https, or localhost). Many mobile browsers do NOT treat a locally
     opened file:// page as secure, so crypto.subtle is undefined there
     and login silently breaks. This fallback keeps login working either
     way. (Standard FIPS 180-4 algorithm, tested against known vectors.) */
  function sha256PureJS(message){
    var K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    function rotr(x,n){ return (x>>>n) | (x<<(32-n)); }
    var bytes = [];
    for(var i=0;i<message.length;i++){
      var c = message.charCodeAt(i);
      if(c < 0x80){ bytes.push(c); }
      else if(c < 0x800){
        bytes.push(0xc0 | (c>>6), 0x80 | (c & 0x3f));
      }else if(c >= 0xd800 && c <= 0xdbff && i+1 < message.length){
        var c2 = message.charCodeAt(++i);
        var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        bytes.push(0xf0 | (cp>>18), 0x80 | ((cp>>12)&0x3f), 0x80 | ((cp>>6)&0x3f), 0x80 | (cp & 0x3f));
      }else{
        bytes.push(0xe0 | (c>>12), 0x80 | ((c>>6)&0x3f), 0x80 | (c & 0x3f));
      }
    }
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while(bytes.length % 64 !== 56) bytes.push(0);
    bytes = bytes.concat([0,0,0,0, (bitLen>>>24)&0xff, (bitLen>>>16)&0xff, (bitLen>>>8)&0xff, bitLen&0xff]);

    for(var chunkStart=0; chunkStart<bytes.length; chunkStart+=64){
      var w = new Array(64);
      for(var t=0;t<16;t++){
        w[t] = ((bytes[chunkStart+t*4]<<24) | (bytes[chunkStart+t*4+1]<<16) | (bytes[chunkStart+t*4+2]<<8) | (bytes[chunkStart+t*4+3])) >>> 0;
      }
      for(var t2a=16;t2a<64;t2a++){
        var s0 = rotr(w[t2a-15],7) ^ rotr(w[t2a-15],18) ^ (w[t2a-15]>>>3);
        var s1 = rotr(w[t2a-2],17) ^ rotr(w[t2a-2],19) ^ (w[t2a-2]>>>10);
        w[t2a] = (w[t2a-16] + s0 + w[t2a-7] + s1) >>> 0;
      }
      var a=H[0],b=H[1],c2v=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(var t3=0;t3<64;t3++){
        var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        var ch = (e & f) ^ ((~e) & g);
        var temp1 = (h + S1 + ch + K[t3] + w[t3]) >>> 0;
        var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        var maj = (a & b) ^ (a & c2v) ^ (b & c2v);
        var temp2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+temp1)>>>0;
        d=c2v; c2v=b; b=a; a=(temp1+temp2)>>>0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c2v)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    var hex = "";
    for(var idx=0; idx<8; idx++){ hex += ("00000000" + H[idx].toString(16)).slice(-8); }
    return hex;
  }

  function sha256Hex(text){
    try{
      if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
        var enc = new TextEncoder().encode(text);
        return crypto.subtle.digest("SHA-256", enc).then(function(buf){
          var bytes = Array.from(new Uint8Array(buf));
          return bytes.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
        }).catch(function(){
          return sha256PureJS(text);
        });
      }
    }catch(e){ /* fall through to pure-JS version below */ }
    return Promise.resolve(sha256PureJS(text));
  }

  function tryLogin(){
    var val = document.getElementById("pwInput").value;
    var btn = document.getElementById("loginConfirm");
    if(!val) return;
    btn.disabled = true;
    Promise.resolve().then(function(){
      return sha256Hex(val);
    }).then(function(hash){
      btn.disabled = false;
      if(hash === ADMIN_PASSWORD_HASH){
        close("loginOverlay");
        buildAdminForm();
        open("adminOverlay");
      }else{
        document.getElementById("loginError").textContent = "비밀번호가 올바르지 않습니다.";
      }
    }).catch(function(err){
      btn.disabled = false;
      document.getElementById("loginError").textContent = "이 브라우저에서는 로그인을 확인할 수 없습니다.";
      console.warn(err);
    });
  }
  document.getElementById("loginConfirm").addEventListener("click", tryLogin);
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") tryLogin();
  });

  /* ---------- basic right-click / view-source deterrent ----------
     Note: this only discourages casual right-click users. It cannot stop
     someone determined (devtools, Ctrl+U, mobile "view source" apps) —
     the real protection is that the password itself is never stored in
     plaintext above (only its SHA-256 hash). */
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  document.getElementById("saveBtn").addEventListener("click", function(){
    var btn = this;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stripImages(state.content)));
    }catch(err){
      showToast("저장에 실패했습니다");
      return;
    }
    render();
    if(!fbReady){
      showToast("저장했습니다 (이 기기에만 저장됨 — 파이어베이스 연결 안 됨)");
      return;
    }
    btn.disabled = true;
    var batch = fbDb.batch();
    batch.set(siteCollectionRef().doc("meta"), { hero: state.content.hero, footer: state.content.footer });
    state.content.steps.forEach(function(step, i){
      batch.set(siteCollectionRef().doc(stepDocId(i)), step);
    });
    batch.commit().then(function(){
      btn.disabled = false;
      showToast("저장했습니다 (클라우드 동기화 완료)");
    }).catch(function(err){
      btn.disabled = false;
      console.warn("Firestore save failed:", err);
      showToast("로컬에는 저장됐지만 클라우드 저장에 실패했습니다");
    });
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(state.content, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "yt-guide-content.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("내보냈습니다");
  });

  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        state.content = mergeContent(parsed);
        buildAdminForm();
        render();
        showToast("가져왔습니다 — 저장을 눌러야 반영됩니다");
      }catch(err){
        showToast("파일을 읽을 수 없습니다");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("resetBtn").addEventListener("click", function(){ open("confirmOverlay"); });
  document.getElementById("confirmCancel").addEventListener("click", function(){ close("confirmOverlay"); });
  document.getElementById("confirmOk").addEventListener("click", function(){
    localStorage.removeItem(STORAGE_KEY);
    state.content = clone(DEFAULT_CONTENT);
    buildAdminForm();
    render();
    close("confirmOverlay");
    if(fbReady){
      var batch = fbDb.batch();
      batch.delete(siteCollectionRef().doc("meta"));
      DEFAULT_CONTENT.steps.forEach(function(_, i){ batch.delete(siteCollectionRef().doc(stepDocId(i))); });
      batch.commit().then(function(){
        showToast("초기화했습니다 (클라우드 포함)");
      }).catch(function(){
        showToast("초기화했습니다 (클라우드 삭제는 실패)");
      });
    }else{
      showToast("초기화했습니다");
    }
  });

  render();
  syncFromCloud();
})();
</script>
</body>
</html>
